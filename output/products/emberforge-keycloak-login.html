<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>EmberForge Keycloak Login</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    :root {
      --bp-color-bone-300: #B8C5D6;
      --bp-color-bone-50: #E6EDF5;
      --bp-color-ember-300: #E2A982;
      --bp-color-ember-500: #C9895B;
      --bp-color-ink-500: #3E5573;
      --bp-color-ink-600: #2F4259;
      --bp-color-ink-700: #243447;
      --bp-color-ink-800: #1F2937;
      --bp-color-ink-900: #0F1724;
      --bp-color-ink-950: #0A111C;
      --bp-color-sky-300: #A5DEFB;
      --bp-color-sky-400: #7DD3FC;
      --bp-color-sky-500: #38BDF8;
      --bp-color-sky-soft: #7DD3FC0F;
      --bp-color-status-error: #F87171;
      --bp-color-status-error-foreground: #FCA5A5;
      --bp-color-status-error-surface: #F871711A;
      --bp-color-status-info-surface: #7DD3FC1A;
      --bp-color-status-success: #4ADE80;
      --bp-color-status-success-foreground: #86EFAC;
      --bp-color-status-success-surface: #4ADE801F;
      --bp-color-status-warning: #E0B341;
      --bp-color-status-warning-foreground: #F3D783;
      --bp-color-status-warning-surface: #E0B3411A;
      --bp-color-transparent-clear: #00000000;
      --bp-theme-primary: var(--bp-color-sky-400);
      --bp-theme-background: var(--bp-color-ink-900);
      --bp-theme-surface: var(--bp-color-ink-800);
      --bp-theme-foreground: var(--bp-color-bone-50);
      --bp-theme-accent: var(--bp-color-ember-500);
      --bp-theme-success: var(--bp-color-status-success);
      --bp-theme-warning: var(--bp-color-status-warning);
      --bp-theme-error: var(--bp-color-status-error);
      --bp-font-heading: "Orbitron", "Iceland", "Bank Gothic", system-ui, sans-serif;
      --bp-font-body: "Inter", "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --bp-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Menlo", monospace;
      --bp-type-display: 80px;
      --bp-type-display-font: var(--bp-font-heading);
      --bp-type-display-weight: 500;
      --bp-type-display-line-height: 1;
      --bp-type-display-letter-spacing: 0.08em;
      --bp-type-title: 56px;
      --bp-type-title-font: var(--bp-font-heading);
      --bp-type-title-weight: 600;
      --bp-type-title-line-height: 1.15;
      --bp-type-title-letter-spacing: -0.01em;
      --bp-type-heading: 32px;
      --bp-type-heading-font: var(--bp-font-heading);
      --bp-type-heading-weight: 700;
      --bp-type-heading-line-height: 1.3;
      --bp-type-heading-letter-spacing: normal;
      --bp-type-body: 16px;
      --bp-type-body-font: var(--bp-font-body);
      --bp-type-body-weight: 400;
      --bp-type-body-line-height: 1.55;
      --bp-type-body-letter-spacing: normal;
      --bp-type-label: 12px;
      --bp-type-label-font: var(--bp-font-body);
      --bp-type-label-weight: 500;
      --bp-type-label-line-height: normal;
      --bp-type-label-letter-spacing: 0.18em;
      --bp-type-caption: 12px;
      --bp-type-caption-font: var(--bp-font-body);
      --bp-type-caption-weight: 400;
      --bp-type-caption-line-height: normal;
      --bp-type-caption-letter-spacing: normal;
      --bp-material-canvas: var(--bp-color-ink-900);
      --bp-material-surface: var(--bp-color-ink-800);
      --bp-material-raised: var(--bp-color-ink-700);
      --bp-material-field: var(--bp-color-ink-950);
      --bp-material-transparent: var(--bp-color-transparent-clear);
      --bp-material-foreground: var(--bp-color-bone-50);
      --bp-material-muted: var(--bp-color-bone-300);
      --bp-material-accent: var(--bp-color-ember-500);
      --bp-material-accent-hover: var(--bp-color-ember-300);
      --bp-material-outline: var(--bp-color-ink-600);
      --bp-material-interaction: var(--bp-color-sky-400);
      --bp-material-interaction-hover: var(--bp-color-sky-300);
      --bp-material-interaction-soft: var(--bp-color-sky-soft);
      --bp-material-interaction-pressed: var(--bp-color-sky-500);
      --bp-material-disabled: var(--bp-color-ink-500);
      --bp-material-success: var(--bp-color-status-success);
      --bp-material-success-surface: var(--bp-color-status-success-surface);
      --bp-material-success-foreground: var(--bp-color-status-success-foreground);
      --bp-material-warning: var(--bp-color-status-warning);
      --bp-material-warning-surface: var(--bp-color-status-warning-surface);
      --bp-material-warning-foreground: var(--bp-color-status-warning-foreground);
      --bp-material-error: var(--bp-color-status-error);
      --bp-material-error-surface: var(--bp-color-status-error-surface);
      --bp-material-error-foreground: var(--bp-color-status-error-foreground);
      --bp-material-info: var(--bp-color-sky-400);
      --bp-material-info-surface: var(--bp-color-status-info-surface);
      --bp-material-info-foreground: var(--bp-color-sky-300);
      --bp-border-hairline: 1px;
      --bp-border-regular: 1px;
      --bp-border-strong: 1px;
      --bp-border-style: solid;
      --bp-radius-small: 4px;
      --bp-radius-medium: 12px;
      --bp-radius-large: 16px;
      --bp-radius-pill: 999px;
      --bp-radius-control: 8px;
      --bp-shadow-low: 0 1px 2px rgba(0,0,0,0.25);
      --bp-shadow-medium: 0 6px 18px rgba(0,0,0,0.35);
      --bp-shadow-high: 0 18px 44px rgba(0,0,0,0.45);
      --bp-shadow-none: none;
      --bp-shadow-glow: 0 0 0 1px rgba(125,211,252,0.18), 0 6px 24px rgba(125,211,252,0.10);
      --bp-shadow-focus: 0 0 0 3px rgba(125,211,252,0.15);
      --bp-shadow-glow-accent: 0 0 0 1px rgba(201,137,91,0.30), 0 6px 22px rgba(201,137,91,0.18);
      --bp-motion-fast: 120ms;
      --bp-motion-normal: 220ms;
      --bp-motion-slow: 420ms;
      --bp-motion-easing: cubic-bezier(0.2, 0.7, 0.2, 1);
      --bp-motion-rest-offset: 0px;
      --bp-motion-hover-offset: -1px;
      --bp-spacing-none: 0;
      --bp-spacing-xs: 4px;
      --bp-spacing-small: 8px;
      --bp-spacing-medium: 16px;
      --bp-spacing-large: 32px;
      --bp-spacing-xl: 64px;
      --bp-art-canvas: #0F1724;
      --bp-art-interaction: #7DD3FC;
      --bp-art-warm-accent: #C9895B;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: var(--bp-spacing-xl);
      box-sizing: border-box;
      background: var(--bp-theme-background);
      color: var(--bp-theme-foreground);
      font-family: var(--bp-font-body);
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--bp-font-heading); }
    code, pre, kbd, samp { font-family: var(--bp-font-mono); }
    .bp-product-header {
      max-width: 72rem;
      margin-bottom: var(--bp-spacing-xl);
      padding: var(--bp-spacing-large);
      box-sizing: border-box;
      background: var(--bp-material-surface);
      border-left: var(--bp-border-strong) var(--bp-border-style) var(--bp-material-accent);
      border-radius: var(--bp-radius-medium);
    }
    .bp-product-header h1 {
      margin: 0;
      font-size: var(--bp-type-title);
    }
    .bp-layout { gap: var(--bp-spacing-medium); }
    .bp-region { padding: var(--bp-spacing-large); }
    .bp-region h2 { margin-top: 0; }
    .bp-lockup {
      display: flex;
      align-items: center;
      gap: var(--bp-spacing-medium);
    }
    .bp-lockup h2 { margin-top: 0; }
    .bp-brand-mark {
      flex: none;
      width: 3rem;
      height: 3rem;
      color: var(--bp-material-accent);
    }
    @media (max-width: 960px) {
      body { padding: var(--bp-spacing-large); }
    }
    body {
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--bp-art-interaction) 8%, transparent), transparent 38%),
        radial-gradient(circle at 88% 100%, color-mix(in srgb, var(--bp-art-warm-accent) 6%, transparent), transparent 34%),
        var(--bp-art-canvas);
    }
    .bp-product-header {
      border: var(--bp-border-hairline) var(--bp-border-style) var(--bp-material-outline);
      border-left-color: var(--bp-material-outline);
    }
    .bp-product-header::after {
      content: "";
      display: block;
      height: var(--bp-border-hairline);
      margin-top: var(--bp-spacing-medium);
      background: linear-gradient(90deg, var(--bp-material-outline), transparent);
    }
    @media (prefers-reduced-motion: reduce) {
      .bp-region { transition: none; }
    }
    .bp-canvas { background: var(--bp-material-canvas); }
    .bp-region {
      background: var(--bp-material-raised);
      color: var(--bp-material-foreground);
      border: var(--bp-border-hairline) var(--bp-border-style) var(--bp-material-outline);
      border-radius: var(--bp-radius-medium);
      box-shadow: var(--bp-shadow-low);
      transition: box-shadow var(--bp-motion-normal) var(--bp-motion-easing);
    }
    .bp-metric {
      margin: var(--bp-spacing-small) 0;
      color: var(--bp-material-accent);
      font-family: var(--bp-font-heading);
      font-size: calc(var(--bp-type-heading) * 2);
      font-weight: 700;
      line-height: 1;
    }
    .bp-metric-details {
      display: grid;
      gap: var(--bp-spacing-xs);
      margin: var(--bp-spacing-small) 0;
      padding: 0;
      list-style: none;
      color: var(--bp-material-muted);
      font-size: var(--bp-type-caption);
    }
    .bp-metric-details li {
      display: flex;
      justify-content: space-between;
      gap: var(--bp-spacing-small);
      border-bottom: var(--bp-border-hairline) var(--bp-border-style) var(--bp-material-outline);
    }
    .bp-metric-detail-value {
      color: var(--bp-material-foreground);
      font-weight: 700;
    }
    .bp-status-summary {
      display: grid;
      grid-template-columns: minmax(12rem, 18rem) 1fr;
      gap: var(--bp-spacing-large);
      margin-bottom: var(--bp-spacing-large);
    }
    .bp-status-overall {
      padding: var(--bp-spacing-large);
      background: var(--bp-material-raised);
      border: var(--bp-border-hairline) var(--bp-border-style) var(--bp-material-outline);
      border-radius: var(--bp-radius-medium);
    }
    .bp-status-overall strong {
      color: var(--bp-material-accent);
      font-family: var(--bp-font-heading);
      font-size: var(--bp-type-display);
    }
    .bp-status-milestones, .bp-status-areas {
      display: grid;
      gap: var(--bp-spacing-medium);
    }
    .bp-status-milestones { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .bp-status-areas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bp-status-card {
      padding: var(--bp-spacing-large);
      background: var(--bp-material-raised);
      border: var(--bp-border-hairline) var(--bp-border-style) var(--bp-material-outline);
      border-radius: var(--bp-radius-medium);
    }
    .bp-status-card h2, .bp-status-card h3 { margin-top: 0; }
    .bp-status-progress {
      width: 100%;
      accent-color: var(--bp-material-accent);
    }
    .bp-status-label { color: var(--bp-material-muted); }
    @media (max-width: 960px) {
      .bp-status-summary, .bp-status-milestones, .bp-status-areas { grid-template-columns: 1fr; }
    }
    .bp-layout { box-sizing: border-box; }
    .bp-region { box-sizing: border-box; }
    @media (max-width: 640px) {
      .bp-layout-emberforge-keycloak-login-responsive { grid-template-columns:repeat(1,minmax(0,1fr)) !important; }
      [data-region="keycloak-login-identity-region"] { grid-column:1 / span 1 !important; grid-row:auto !important; order:1; }
      [data-region="keycloak-login-password-region"] { grid-column:1 / span 1 !important; grid-row:auto !important; order:2; }
      [data-region="keycloak-login-submit-region"] { grid-column:1 / span 1 !important; grid-row:auto !important; order:3; }
    }
  </style>
</head>
<body data-world="beckeringh-palace" data-theme="forge" data-art-direction="emberforge-art-direction" data-art-glow="controlled" data-art-ornament="technical-linework" data-art-density="spacious" data-art-imagery="isometric-line-art" data-art-warm-accent-limit="2" data-typography="forge-interface" data-font-delivery="local-only" data-product-mode="interactive" data-product-content="composition" data-time-context="applicable">
  <header class="bp-product-header">
    <h1>EmberForge Sign In</h1>
  </header>
  <form class="bp-layout bp-layout-emberforge-keycloak-login-responsive" data-composition-role="login-formulier" data-layout-type="grid" data-responsive-breakpoint="640" data-compact-columns="1" style="display:grid;grid-template-columns:repeat(1,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))">
    <section class="bp-region" data-region="keycloak-login-identity-region" data-instance="keycloak-login-identity" data-compact-order="1" style="grid-column:1 / span 1;grid-row:1 / span 1">
      <h2>Username or email</h2>
            <div class="bp-component-example bp-example-input">
              <label id="bp-example-keycloak-login-identity-forge-input-default-example-rest-label" for="bp-example-keycloak-login-identity-forge-input-default-example-rest-control" class="bp-example-label">Username or email</label>
              <input id="bp-example-keycloak-login-identity-forge-input-default-example-rest-control" type="email" class="bp-forge-input bp-variant-forge-input-default" data-example="forge-input-default-example" data-component="forge-input" data-component-role="invoer" data-component-anatomy="label waarde melding" data-variant="forge-input-default" data-component-state="rest" data-component-states="rest hover focus pressed disabled" data-appearance="forge-input-rest-appearance" data-accessibility-contract="forge-input-accessibility" data-accessibility-role="tekstinvoer" data-accessibility-name-source="label" data-accessibility-value-source="waarde" data-accessibility-error-source="melding" data-accessibility-disabled="native" data-accessibility-focus="tabvolgorde" data-accessibility-keyboard="tekstinvoer" value="erik@thb1home.nl">
            </div>
    </section>
    <section class="bp-region" data-region="keycloak-login-password-region" data-instance="keycloak-login-password" data-compact-order="2" style="grid-column:1 / span 1;grid-row:2 / span 1">
      <h2>Password</h2>
            <div class="bp-component-example bp-example-input">
              <label id="bp-example-keycloak-login-password-forge-input-password-example-rest-label" for="bp-example-keycloak-login-password-forge-input-password-example-rest-control" class="bp-example-label">Password</label>
              <input id="bp-example-keycloak-login-password-forge-input-password-example-rest-control" type="password" class="bp-forge-input bp-variant-forge-input-default" data-example="forge-input-password-example" data-component="forge-input" data-component-role="invoer" data-component-anatomy="label waarde melding" data-variant="forge-input-default" data-component-state="rest" data-component-states="rest hover focus pressed disabled" data-appearance="forge-input-rest-appearance" data-accessibility-contract="forge-input-accessibility" data-accessibility-role="tekstinvoer" data-accessibility-name-source="label" data-accessibility-value-source="waarde" data-accessibility-error-source="melding" data-accessibility-disabled="native" data-accessibility-focus="tabvolgorde" data-accessibility-keyboard="tekstinvoer" value="not-a-secret">
            </div>
    </section>
    <section class="bp-region" data-region="keycloak-login-submit-region" data-instance="keycloak-login-submit" data-compact-order="3" style="grid-column:1 / span 1;grid-row:3 / span 1">
      <h2>Sign In</h2>
            <button type="submit" class="bp-forge-button bp-variant-forge-button-primary" data-example="forge-button-primary-example" data-component="forge-button" data-component-role="actie" data-component-anatomy="label" data-variant="forge-button-primary" data-component-state="rest" data-component-states="rest hover focus pressed disabled" data-appearance="forge-button-primary-rest-appearance" data-accessibility-contract="forge-button-accessibility" data-accessibility-role="actie" data-accessibility-name-source="label" data-accessibility-disabled="native" data-accessibility-focus="tabvolgorde" data-accessibility-keyboard="activeren" data-accessibility-keys="Enter Space">Sign In</button>
    </section>
  </form>
</body>
</html>
