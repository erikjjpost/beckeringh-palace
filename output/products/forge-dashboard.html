<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Forge Dashboard HTML</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    :root {
      --bp-theme-primary: #D86A35;
      --bp-theme-background: #171A1F;
      --bp-theme-surface: #171A1F;
      --bp-theme-foreground: #ECECEC;
      --bp-theme-accent: #D86A35;
      --bp-font-heading: "Aptos Display";
      --bp-font-body: "Aptos";
      --bp-font-mono: "JetBrains Mono";
    }
    body {
      margin: 0;
      background: var(--bp-theme-background);
      color: var(--bp-theme-foreground);
      font-family: var(--bp-font-body);
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--bp-font-heading); }
    code, pre, kbd, samp { font-family: var(--bp-font-mono); }
    .bp-canvas { position: relative; overflow: hidden; }
    .bp-region { position: absolute; box-sizing: border-box; }
  </style>
</head>
<body data-world="beckeringh-palace" data-theme="forge">
  <main class="bp-canvas bp-layout-forge-dashboard-ultrawide" style="width:3840px;height:1080px" data-composition="forge-dashboard">
    <h1>Forge Dashboard Ultrawide</h1>
    <section class="bp-region bp-forge-panel" data-region="forge-dashboard-left" style="left:80px;top:120px;width:1120px;height:840px">
      <h2>Linkerpaneel</h2>
    </section>
    <section class="bp-region bp-forge-panel" data-region="forge-dashboard-center" style="left:1360px;top:120px;width:1120px;height:840px">
      <h2>Middenpaneel</h2>
    </section>
    <section class="bp-region bp-forge-panel" data-region="forge-dashboard-right" style="left:2640px;top:120px;width:1120px;height:840px">
      <h2>Rechterpaneel</h2>
    </section>
  </main>
</body>
</html>
