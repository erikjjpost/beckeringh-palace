<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Forge Dashboard HTML</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    :root {
      --bp-theme-primary: #D86A35;
      --bp-theme-background: #171A1F;
      --bp-theme-surface: #171A1F;
      --bp-theme-foreground: #ECECEC;
      --bp-theme-accent: #D86A35;
      --bp-font-heading: "Aptos Display";
      --bp-font-body: "Aptos";
      --bp-font-mono: "JetBrains Mono";
      --bp-type-display: 64px;
      --bp-type-title: 40px;
      --bp-type-heading: 28px;
      --bp-type-body: 16px;
      --bp-type-label: 14px;
      --bp-type-caption: 12px;
      --bp-material-canvas: #171A1F;
      --bp-material-surface: #171A1F;
      --bp-material-raised: #171A1F;
      --bp-material-foreground: #ECECEC;
      --bp-material-accent: #D86A35;
      --bp-border-hairline: 1px;
      --bp-border-regular: 2px;
      --bp-border-strong: 3px;
      --bp-border-style: solid;
      --bp-radius-small: 4px;
      --bp-radius-medium: 12px;
      --bp-radius-large: 24px;
      --bp-radius-pill: 999px;
      --bp-shadow-low: 0 2px 8px #00000040;
      --bp-shadow-medium: 0 8px 24px #00000059;
      --bp-shadow-high: 0 20px 48px #00000073;
      --bp-motion-fast: 120ms;
      --bp-motion-normal: 220ms;
      --bp-motion-slow: 420ms;
      --bp-motion-easing: cubic-bezier(0.2, 0.8, 0.2, 1);
      --bp-spacing-none: 0;
      --bp-spacing-xs: 4px;
      --bp-spacing-small: 8px;
      --bp-spacing-medium: 16px;
      --bp-spacing-large: 24px;
      --bp-spacing-xl: 40px;
    }
    body {
      margin: 0;
      background: var(--bp-theme-background);
      color: var(--bp-theme-foreground);
      font-family: var(--bp-font-body);
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--bp-font-heading); }
    code, pre, kbd, samp { font-family: var(--bp-font-mono); }
    .bp-canvas { background: var(--bp-material-canvas); }
    .bp-region {
      background: var(--bp-material-raised);
      color: var(--bp-material-foreground);
      border: var(--bp-border-hairline) var(--bp-border-style) var(--bp-material-accent);
      border-radius: var(--bp-radius-medium);
      box-shadow: var(--bp-shadow-low);
      transition: box-shadow var(--bp-motion-normal) var(--bp-motion-easing);
    }
    .bp-canvas { position: relative; overflow: hidden; }
    .bp-region { position: absolute; box-sizing: border-box; }
  </style>
</head>
<body data-world="beckeringh-palace" data-theme="forge">
  <main class="bp-canvas bp-layout-forge-dashboard-ultrawide" style="width:3840px;height:1080px" data-composition="forge-dashboard">
    <h1>Forge Dashboard Ultrawide</h1>
    <section class="bp-region bp-forge-panel" data-region="forge-dashboard-left" style="left:80px;top:120px;width:1120px;height:840px">
      <h2>Linkerpaneel</h2>
    </section>
    <section class="bp-region bp-forge-panel" data-region="forge-dashboard-center" style="left:1360px;top:120px;width:1120px;height:840px">
      <h2>Middenpaneel</h2>
    </section>
    <section class="bp-region bp-forge-panel" data-region="forge-dashboard-right" style="left:2640px;top:120px;width:1120px;height:840px">
      <h2>Rechterpaneel</h2>
    </section>
  </main>
</body>
</html>
