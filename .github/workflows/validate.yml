name: Validate Beckeringh Palace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source model
        run: python tools/validate.py
      - name: Compile BAT
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/compile_bat.py
      - name: Generate legacy outputs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/generate.py
      - name: Synchronize generated outputs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "M8.5b: synchronize generated outputs"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run M5.3 token tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_native_product_slice.py' -v
      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify reproducibility
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "RESULTAAT: NIET REPRODUCEERBAAR"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo "RESULTAAT: GELDIG EN REPRODUCEERBAAR"
