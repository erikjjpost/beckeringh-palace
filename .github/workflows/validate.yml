name: Validate Beckeringh Palace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate, generate and test
        shell: bash
        run: |
          if ! python tools/bp.py check > bp-check.log 2>&1; then
            tail -n 120 bp-check.log
            exit 1
          fi
          cat bp-check.log
