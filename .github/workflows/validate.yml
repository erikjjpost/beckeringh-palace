name: Validate Beckeringh Palace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require project status update
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- project/status.json; then
            echo "RESULTAAT: PROJECTSTATUS NIET BIJGEWERKT"
            echo "Iedere pull request moet project/status.json actualiseren."
            exit 1
          fi
      - name: Validate source model
        run: python tools/validate.py
      - name: Compile BAT
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/compile_bat.py
      - name: Generate legacy outputs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/generate.py
      - name: Generate project status
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/render_status.py
      - name: Run M5.3 token tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_native_product_slice.py' -v
      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify reproducibility
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "RESULTAAT: NIET REPRODUCEERBAAR"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo "RESULTAAT: GELDIG EN REPRODUCEERBAAR"
