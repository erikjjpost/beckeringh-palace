name: Validate Beckeringh Palace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require project status update
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- project/status.json; then
            echo "RESULTAAT: PROJECTSTATUS NIET BIJGEWERKT"
            echo "Iedere pull request moet project/status.json actualiseren."
            exit 1
          fi
      - name: Repository gate
        run: python tools/bp.py check
